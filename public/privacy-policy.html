    let currentLang = localStorage.getItem('zyko_legal_lang') || 'en';

    function renderDocument(lang) {
      const data = PRIVACY_TEXTS[lang] || PRIVACY_TEXTS['en'];
      const langCfg = LANGUAGES[lang] || LANGUAGES['en'];

      document.getElementById('current-lang-flag').textContent = langCfg.flag;
      document.getElementById('current-lang-name').textContent = langCfg.name;
      document.getElementById('doc-title').textContent = data.title;
      document.getElementById('doc-content').innerHTML = data.content;
      document.documentElement.lang = lang;
    }

    function selectLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('zyko_legal_lang', lang);
      renderDocument(lang);
      const menu = document.getElementById('lang-menu');
      if (menu) menu.classList.add('hidden');
    }

    // Initial render
    renderDocument(currentLang);
